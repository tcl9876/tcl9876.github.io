<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Troy Luhman — researcher." />
  <title>Troy Luhman</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: #fff;
      color: #111;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 24px;
      font-size: 1.05rem;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      opacity: 0.65;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
        color: #eee;
      }
    }

    @media (max-width: 600px) {
      main {
        padding-top: 64px;
      }
